name: main-env
channels:
  - conda-forge
  - bioconda
dependencies:
  - bamtools=2.5.3
  - bbmap=39.28  # 40.02's BBMerge loses or hangs on paired reads (2026-10-29)
  - bcftools=1.24
  - bedtools=2.31.1
  - bwa=0.7.19
  - dask=2026.8.0
  - fastp=1.4.0
  - hisat2=2.2.3
  - htslib=1.24
  - matplotlib=3.11.2
  - minimap2=2.31
  - numpy=2.5.3
  - pandas=3.0.6
  - pathos=0.3.5
  - python=3.14.8
  - samtools=1.24
  - seqtk=1.5
  - vcftools=0.1.17
prefix: /opt/conda/envs/main-env
